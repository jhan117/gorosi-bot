name: 고로시 봇 v2

on:
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    
    # 레포지토리 자동 커밋을 위한 쓰기 권한 명시
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Load state from state branch
      run: |
        if git fetch origin state; then
          git checkout FETCH_HEAD -- data/bidx.json
        fi
        cp data/bidx.json /tmp/bidx.json.before

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # 의존성 설치 속도 단축을 위한 캐싱 활성화

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run script
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        PORTAL_ID: ${{ secrets.PORTAL_ID }}
        PORTAL_PW: ${{ secrets.PORTAL_PW }}
        PYTHONPATH: .
      run: python src/main.py

    - name: Commit and Push changes to state branch
      run: |
        if ! cmp -s data/bidx.json /tmp/bidx.json.before; then
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp data/bidx.json /tmp/bidx.json.after
          if git fetch origin state; then
            git checkout -f -B state FETCH_HEAD
          else
            git checkout --orphan state
            git rm -rf .
          fi
          mkdir -p data
          cp /tmp/bidx.json.after data/bidx.json
          git add data/bidx.json
          git commit -m "Update last checked notice IDs [skip ci]"
          git push origin state
        fi
